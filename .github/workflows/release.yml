name: Release Skills

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Skills live at <plugin>/skills/<skill>/SKILL.md. Each .skill archive
      # contains the skill directory at its root, which is what Claude.ai
      # expects on upload.
      - name: Package skills
        run: |
          set -euo pipefail
          mkdir -p dist
          for skill_md in */skills/*/SKILL.md; do
            skill_dir=$(dirname "$skill_md")
            skill_name=$(basename "$skill_dir")
            (cd "$(dirname "$skill_dir")" && zip -r "$GITHUB_WORKSPACE/dist/${skill_name}.skill" "$skill_name")
            echo "Packaged: dist/${skill_name}.skill"
          done
          ls -l dist

      - name: Create prerelease (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (prerelease)
          files: "dist/*.skill"
          prerelease: true
          make_latest: false

      - name: Create release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/*.skill"
          generate_release_notes: true
          make_latest: true
